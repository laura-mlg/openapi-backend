# This configuration was generated with the setup-qlty-toml skill (v2).
# For reference: https://docs.qlty.sh/qlty-toml
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/*.d.ts",
  "**/examples/**",
]

test_patterns = [
  "**/__tests__/**",
  "**/*.test.*",
  "**/*.spec.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "eslint"
mode = "comment"
config_files = [".eslintrc.js"]
extra_packages = [
  "@typescript-eslint/parser@5.62.0",
  "@typescript-eslint/eslint-plugin@5.62.0",
]

[[plugin]]
name = "tsc"
mode = "comment"
skip_upstream = true

[[plugin]]
name = "prettier"
mode = "comment"

[[plugin]]
name = "spectral"
mode = "comment"

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"

[[exclude]]
plugins = ["tsc", "eslint"]
file_patterns = ["**/__generated__/**", "**/*.generated.ts"]

[[triage]]
plugins = ["eslint"]
rules = ["no-eval"]
set.mode = "block"
