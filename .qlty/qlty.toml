# This configuration was generated with the setup-qlty-toml skill (v2).
# For reference: https://docs.qlty.sh/qlty-toml
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/*.d.ts",
  "**/examples/**",
]

test_patterns = [
  "**/__tests__/**",
  "**/*.test.*",
  "**/*.spec.*",
]

[smells]
mode = "comment"

# Required — points to the built-in Qlty plugin registry.
[[source]]
name = "default"
default = true

# Language linters
[[plugin]]
name = "eslint"
mode = "comment"
config_files = [".eslintrc.js"]
extra_packages = [
  "@typescript-eslint/parser@5.62.0",
  "@typescript-eslint/eslint-plugin@5.62.0",
]

[[plugin]]
name = "tsc"
mode = "comment"
skip_upstream = true

# Formatters
[[plugin]]
name = "prettier"
mode = "comment"
config_files = [".prettierrc"]

# OpenAPI spec linter
[[plugin]]
name = "spectral"
mode = "comment"

# Security scanners (block mode)
[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"

# Cross-language tools
[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"

# Per-plugin exclusion: exclude generated TypeScript type files from tsc and eslint.
[[exclude]]
plugins = ["tsc", "eslint"]
file_patterns = [
  "**/__generated__/**",
  "**/*.generated.ts",
  "**/*.generated.d.ts",
]

# Triage 1: Recategorize spectral's operation-security-defined rule as "security".
[[triage]]
plugins = ["spectral"]
rules = ["operation-security-defined"]
set.category = "security"

# Triage 2: Elevate eslint no-eval to block mode and security category.
[[triage]]
plugins = ["eslint"]
rules = ["no-eval"]
set.mode = "block"
set.category = "security"

# Triage 3: Ignore @typescript-eslint/no-explicit-any in test files.
[[triage]]
plugins = ["eslint"]
rules = ["@typescript-eslint/no-explicit-any"]
file_patterns = ["**/*.test.*", "**/*.spec.*", "**/__tests__/**"]
set.ignored = true
